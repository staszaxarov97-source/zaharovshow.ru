
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build
        env:
          NITRO_PRESET: node-server

      - name: Render static page
        run: |
          PORT=3000 node .output/server/index.mjs &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/ -o .output/public/index.html && break
            sleep 1
          done
          test -s .output/public/index.html
          cp .output/public/index.html .output/public/404.html
          cp docs/CNAME .output/public/CNAME
          touch .output/public/.nojekyll
          echo "Files in site:"
          find .output/public -maxdepth 2 -type f | head -80

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./.output/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
